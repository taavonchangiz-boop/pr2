name: Postyar V7 one-time source repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Apply idempotency race fixes and cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function file(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              if (Array.isArray(r.data)) throw new Error(`Not a file: ${path}`);
              return {sha: r.data.sha, text: Buffer.from(r.data.content, 'base64').toString('utf8')};
            }
            async function put(path, text, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha, message,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
            }
            function replaceOnce(text, oldText, newText, path) {
              const n = text.split(oldText).length - 1;
              if (n !== 1) throw new Error(`${path}: expected exactly 1 match, got ${n}`);
              return text.replace(oldText, newText);
            }

            // Ticket: concurrent retries must converge on the winning unique operation key.
            {
              const p = 'src/lib/tickets/index.ts';
              const cur = await file(p);
              if (!cur.text.includes('let ticket: Awaited<ReturnType<typeof db.ticket.create>>;')) {
                let s = replaceOnce(cur.text, '  const ticket = await db.ticket.create({', '  let ticket: Awaited<ReturnType<typeof db.ticket.create>>;\n  try {\n    ticket = await db.ticket.create({', p);
                s = replaceOnce(s,
                  '  });\n\n  await audit({\n    userId: input.userId,\n    actor: "user",\n    action: "ticket_created",',
                  `  });\n  } catch (err) {\n    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {\n      const existing = await db.ticket.findUnique({\n        where: { operationKey: input.operationKey },\n        include: {\n          user: { select: { id: true, firstName: true, lastName: true, businessName: true } },\n          assignedTo: { select: { id: true, firstName: true, lastName: true } },\n          department: { select: { id: true, nameFa: true } },\n          replies: true,\n        },\n      });\n      if (existing) return { ok: true, ticket: toView(existing) };\n    }\n    throw err;\n  }\n\n  await audit({\n    userId: input.userId,\n    actor: "user",\n    action: "ticket_created",`, p);
                await put(p, s, cur.sha, '[postyar-once] ticket P2002 convergence');
              }
            }

            // Notification: same concurrent-retry convergence.
            {
              const p = 'src/lib/notifications/index.ts';
              const cur = await file(p);
              if (!cur.text.includes('let notif: Awaited<ReturnType<typeof db.notification.create>>;')) {
                let s = replaceOnce(cur.text, '  const notif = await db.notification.create({', '  let notif: Awaited<ReturnType<typeof db.notification.create>>;\n  try {\n    notif = await db.notification.create({', p);
                s = replaceOnce(s,
                  '  });\n\n  // Look up the user\'s preferences',
                  `  });\n  } catch (err) {\n    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {\n      const existing = await db.notification.findUnique({ where: { operationKey: input.operationKey } });\n      if (existing) return { ok: true, notificationId: existing.id, emailSent: false, smsSent: false };\n    }\n    throw err;\n  }\n\n  // Look up the user's preferences`, p);
                await put(p, s, cur.sha, '[postyar-once] notification P2002 convergence');
              }
            }

            // Exact outbound operation identity must beat a stale cursor id.
            {
              const p = 'src/lib/bots/workflow.ts';
              const cur = await file(p);
              if (!cur.text.includes('if (!prior && args.priorHistoryId) {')) {
                await put(p, replaceOnce(cur.text, '  if (args.priorHistoryId) {', '  if (!prior && args.priorHistoryId) {', p), cur.sha, '[postyar-once] exact outbound identity');
              }
            }

            // Inbound observability persistence must fail closed.
            {
              const p = 'src/lib/bots/event-dedup.ts';
              const cur = await file(p);
              const oldText = `    // Never fail the event on observability persistence — but never hide\n    // the failure either.\n    console.error("bot history persist failed:", err instanceof Error ? err.message : err);`;
              const newText = `    // Persistence is part of the durable event contract. Do not continue without it.\n    console.error("bot history persist failed:", err instanceof Error ? err.message : err);\n    throw err;`;
              if (cur.text.includes(oldText)) await put(p, replaceOnce(cur.text, oldText, newText, p), cur.sha, '[postyar-once] fail-closed inbound persistence');
            }

            console.log('SOURCE REPAIR STEP COMPLETE');
      - name: Delete all temporary repair workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const d = await github.rest.repos.getContent({owner, repo, path: '.github/workflows', ref: branch});
            for (const e of d.data) {
              if (e.name !== 'ci.yml' && e.name.startsWith('v7-')) {
                await github.rest.repos.deleteFile({owner, repo, path: e.path, branch, sha: e.sha, message: '[postyar-once] remove temporary repair workflow'});
              }
            }
            for (const path of ['V7-final2-trigger.txt','PACKAGE-TRIGGER.txt','V7-final-trigger.txt']) {
              try {
                const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
                await github.rest.repos.deleteFile({owner, repo, path, branch, sha: r.data.sha, message: '[postyar-once] remove temporary trigger'});
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            console.log('TEMPORARY WORKFLOW CLEANUP COMPLETE');
