name: Postyar V7 API-backed repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[postyar-api-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Repair repository through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function read(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              if (Array.isArray(r.data) || !('content' in r.data)) throw new Error(`Not a file: ${path}`);
              return {text: Buffer.from(r.data.content, 'base64').toString('utf8'), sha: r.data.sha};
            }
            async function replaceOnce(path, oldText, newText, message) {
              const cur = await read(path);
              const count = cur.text.split(oldText).length - 1;
              if (count !== 1) throw new Error(`${path}: expected exactly one match, got ${count}`);
              const text = cur.text.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha: cur.sha,
                message, content: Buffer.from(text, 'utf8').toString('base64')
              });
            }
            async function updateIfMissing(path, marker, oldText, newText, message) {
              const cur = await read(path);
              if (cur.text.includes(marker)) return;
              const count = cur.text.split(oldText).length - 1;
              if (count !== 1) throw new Error(`${path}: expected exactly one match, got ${count}`);
              const text = cur.text.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha: cur.sha,
                message, content: Buffer.from(text, 'utf8').toString('base64')
              });
            }

            // Ticket P2002 convergence for concurrent workflow retries.
            await updateIfMissing(
              'src/lib/tickets/index.ts',
              'let ticket: Awaited<ReturnType<typeof db.ticket.create>>;',
              '  const ticket = await db.ticket.create({',
              '  let ticket: Awaited<ReturnType<typeof db.ticket.create>>;\n  try {\n    ticket = await db.ticket.create({',
              '[postyar-api-repair] ticket race safety'
            );
            await updateIfMissing(
              'src/lib/tickets/index.ts',
              'err.code === "P2002"',
              '  });\n\n  await audit({\n    userId: input.userId,\n    actor: "user",\n    action: "ticket_created",',
              `  });
  } catch (err) {
    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {
      const existing = await db.ticket.findUnique({
        where: { operationKey: input.operationKey },
        include: {
          user: { select: { id: true, firstName: true, lastName: true, businessName: true } },
          assignedTo: { select: { id: true, firstName: true, lastName: true } },
          department: { select: { id: true, nameFa: true } },
          replies: true,
        },
      });
      if (existing) return { ok: true, ticket: toView(existing) };
    }
    throw err;
  }

  await audit({
    userId: input.userId,
    actor: "user",
    action: "ticket_created",`,
              '[postyar-api-repair] ticket P2002 convergence'
            );

            // Notification P2002 convergence for concurrent workflow retries.
            await updateIfMissing(
              'src/lib/notifications/index.ts',
              'let notif: Awaited<ReturnType<typeof db.notification.create>>;',
              '  const notif = await db.notification.create({',
              '  let notif: Awaited<ReturnType<typeof db.notification.create>>;\n  try {\n    notif = await db.notification.create({',
              '[postyar-api-repair] notification race safety'
            );
            await updateIfMissing(
              'src/lib/notifications/index.ts',
              'err.code === "P2002"',
              '  });\n\n  // Look up the user\'s preferences',
              `  });
  } catch (err) {
    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {
      const existing = await db.notification.findUnique({ where: { operationKey: input.operationKey } });
      if (existing) return { ok: true, notificationId: existing.id, emailSent: false, smsSent: false };
    }
    throw err;
  }

  // Look up the user's preferences`,
              '[postyar-api-repair] notification P2002 convergence'
            );

            // Exact operation-key identity always wins over a stale cursor id.
            const wf = await read('src/lib/bots/workflow.ts');
            if (wf.text.includes('if (args.priorHistoryId) {') && !wf.text.includes('if (!prior && args.priorHistoryId) {')) {
              await replaceOnce('src/lib/bots/workflow.ts', '  if (args.priorHistoryId) {', '  if (!prior && args.priorHistoryId) {', '[postyar-api-repair] exact outbound identity');
            }

            // Make inbound history persistence fail closed on non-duplicate DB errors.
            const ed = await read('src/lib/bots/event-dedup.ts');
            const oldFail = `    // Never fail the event on observability persistence — but never hide\n    // the failure either.\n    console.error("bot history persist failed:", err instanceof Error ? err.message : err);`;
            const newFail = `    // Persistence is part of the durable event contract. Do not continue without it.\n    console.error("bot history persist failed:", err instanceof Error ? err.message : err);\n    throw err;`;
            if (ed.text.includes(oldFail)) await replaceOnce('src/lib/bots/event-dedup.ts', oldFail, newFail, '[postyar-api-repair] fail-closed inbound persistence');

            // Remove all remediation-only workflows and trigger artifacts. Canonical CI is retained.
            const wfDir = await github.rest.repos.getContent({owner, repo, path: '.github/workflows', ref: branch});
            if (Array.isArray(wfDir.data)) {
              for (const entry of wfDir.data) {
                if (entry.name !== 'ci.yml') {
                  await github.rest.repos.deleteFile({owner, repo, path: entry.path, branch, sha: entry.sha, message: '[postyar-api-repair] remove temporary workflow'});
                }
              }
            }
            for (const path of ['V7-final2-trigger.txt','PACKAGE-TRIGGER.txt','V7-final-trigger.txt']) {
              try {
                const f = await read(path);
                await github.rest.repos.deleteFile({owner, repo, path, branch, sha: f.sha, message: '[postyar-api-repair] remove temporary trigger'});
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            // Final source assertions.
            const checks = {
              'prisma/schema.prisma': ['workflowVersion String?', 'operationKey  String?  @unique'],
              'src/lib/bots/workflow.ts': ['function workflowOperationKey', 'if (!prior && args.priorHistoryId)', 'شرط گردش کار قابل بررسی نیست'],
              'src/lib/bots/event-dedup.ts': ['attempts: { lt: BOT_EVENT_MAX_ATTEMPTS }'],
              'src/lib/tickets/index.ts': ['operationKey?: string', 'err.code === "P2002"'],
              'src/lib/notifications/index.ts': ['operationKey?: string', 'err.code === "P2002"'],
              'prisma/migrations/20260902010000_v7_workflow_action_idempotency/migration.sql': ['CREATE UNIQUE INDEX "BotHistory_operationKey_key"'],
            };
            for (const [path, needles] of Object.entries(checks)) {
              const f = await read(path);
              for (const needle of needles) if (!f.text.includes(needle)) throw new Error(`Assertion failed: ${path} missing ${needle}`);
            }
            console.log('POSTYAR API REPAIR: STATIC ASSERTIONS PASS');
