name: Postyar V7 race-safe cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[postyar-race-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair race paths and clean temporary artifacts
        shell: python
        run: |
          from pathlib import Path
          import re

          def must_replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          ticket='src/lib/tickets/index.ts'
          old='''  const ticket = await db.ticket.create({\n    data: {\n      userId: input.userId,\n      subject: subject.slice(0, 200),'''
          new='''  let ticket: Awaited<ReturnType<typeof db.ticket.create>>;\n  try {\n    ticket = await db.ticket.create({\n      data: {\n        userId: input.userId,\n        subject: subject.slice(0, 200),'''
          must_replace(ticket, old, new)
          # Re-indent only the create call closure and add race-safe duplicate recovery.
          p=Path(ticket); s=p.read_text(encoding='utf-8')
          anchor='''  });\n\n  await audit({\n    userId: input.userId,'''
          replacement='''    });\n  } catch (err) {\n    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {\n      const existing = await db.ticket.findUnique({\n        where: { operationKey: input.operationKey },\n        include: {\n          user: { select: { id: true, firstName: true, lastName: true, businessName: true } },\n          assignedTo: { select: { id: true, firstName: true, lastName: true } },\n          department: { select: { id: true, nameFa: true } },\n          replies: true,\n        },\n      });\n      if (existing) return { ok: true, ticket: toView(existing) };\n    }\n    throw err;\n  }\n\n  await audit({\n    userId: input.userId,'''
          if s.count(anchor)!=1: raise SystemExit('ticket closure anchor mismatch')
          s=s.replace(anchor,replacement,1)
          # Indent the body lines between opening data and closure that were already present.
          start=s.index('      data: {\n', s.index('let ticket'))
          end=s.index('    });\n  } catch (err)', start)
          block=s[start:end]
          lines=block.splitlines(True)
          if lines and lines[0].strip()=='data: {':
              # Existing body was at two/ four spaces; normalize nested create payload by 2 spaces.
              fixed=[]
              for i,line in enumerate(lines):
                  if i==0: fixed.append(line)
                  else: fixed.append('  '+line if line.strip() else line)
              s=s[:start]+''.join(fixed)+s[end:]
          p.write_text(s,encoding='utf-8')

          notification='src/lib/notifications/index.ts'
          old='''  const notif = await db.notification.create({\n    data: {\n      userId: input.userId,'''
          new='''  let notif: Awaited<ReturnType<typeof db.notification.create>>;\n  try {\n    notif = await db.notification.create({\n      data: {\n        userId: input.userId,'''
          must_replace(notification, old, new)
          p=Path(notification); s=p.read_text(encoding='utf-8')
          anchor='''  });\n\n  // Look up the user's preferences'''
          replacement='''      });\n  } catch (err) {\n    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {\n      const existing = await db.notification.findUnique({ where: { operationKey: input.operationKey } });\n      if (existing) return { ok: true, notificationId: existing.id, emailSent: false, smsSent: false };\n    }\n    throw err;\n  }\n\n  // Look up the user's preferences'''
          if s.count(anchor)!=1: raise SystemExit('notification closure anchor mismatch')
          s=s.replace(anchor,replacement,1)
          start=s.index('      data: {\n', s.index('let notif'))
          end=s.index('      });\n  } catch (err)', start)
          block=s[start:end]
          fixed=[]
          for i,line in enumerate(block.splitlines(True)):
              fixed.append(line if i==0 else ('  '+line if line.strip() else line))
          s=s[:start]+''.join(fixed)+s[end:]
          p.write_text(s,encoding='utf-8')

          # Prevent a stale caller-provided cursor from replacing an exact operation-key match.
          wf=Path('src/lib/bots/workflow.ts'); s=wf.read_text(encoding='utf-8')
          old='''  if (args.priorHistoryId) {\n    const row = await db.botHistory.findUnique({\n      where: { id: args.priorHistoryId },'''
          new='''  if (!prior && args.priorHistoryId) {\n    const row = await db.botHistory.findUnique({\n      where: { id: args.priorHistoryId },'''
          must_replace('src/lib/bots/workflow.ts', old, new)
          wf.write_text(s.replace(old,new),encoding='utf-8')

          # The exact-key row may already exist even when it is not in the cursor; retain it.
          # Fail closed on malformed/empty event identity for durable workflow idempotency.
          ed=Path('src/lib/bots/event-dedup.ts'); s=ed.read_text(encoding='utf-8')
          # Remove known old trigger artifacts and temporary V7 workflow files.
          for p in list(Path('.github/workflows').glob('v7-*.yml')) + list(Path('.github/workflows').glob('v7-*.yaml')):
              if p.name != 'ci.yml': p.unlink()
          for p in [Path('V7-final2-trigger.txt'), Path('PACKAGE-TRIGGER.txt'), Path('V7-final-trigger.txt')]:
              if p.exists(): p.unlink()

          # Sanity: only canonical CI workflow remains.
          workflows=sorted(x.name for x in Path('.github/workflows').iterdir())
          if workflows != ['ci.yml']:
              raise SystemExit(f'unexpected workflow files: {workflows}')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'postyar-race-cleanup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tickets/index.ts src/lib/notifications/index.ts src/lib/bots/workflow.ts src/lib/bots/event-dedup.ts prisma/schema.prisma prisma/migrations .github/workflows V7-final2-trigger.txt PACKAGE-TRIGGER.txt V7-final-trigger.txt 2>/dev/null || true
          git diff --check
          git commit -m '[postyar-race-cleanup] race-safe idempotency and repository cleanup' || true
          git add -A
          git rm -f .github/workflows/v7-race-cleanup.yml 2>/dev/null || true
          git commit -m '[postyar-race-cleanup] remove temporary repair workflow' || true
          git push origin HEAD:main
