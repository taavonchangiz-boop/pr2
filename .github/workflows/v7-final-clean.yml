name: Postyar V7 final cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[postyar-final-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old,new), encoding='utf-8')

          # Race-safe Ticket creation: preflight handles normal retries, P2002 handles concurrent retries.
          p=Path('src/lib/tickets/index.ts'); s=p.read_text(encoding='utf-8')
          if 'let ticket: Awaited<ReturnType<typeof db.ticket.create>>;' not in s:
              replace_once('src/lib/tickets/index.ts',
                  '  const ticket = await db.ticket.create({',
                  '  let ticket: Awaited<ReturnType<typeof db.ticket.create>>;\n  try {\n    ticket = await db.ticket.create({')
              replace_once('src/lib/tickets/index.ts',
                  '  });\n\n  await audit({\n    userId: input.userId,\n    actor: "user",\n    action: "ticket_created",',
                  '''  });\n  } catch (err) {\n    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {\n      const existing = await db.ticket.findUnique({\n        where: { operationKey: input.operationKey },\n        include: {\n          user: { select: { id: true, firstName: true, lastName: true, businessName: true } },\n          assignedTo: { select: { id: true, firstName: true, lastName: true } },\n          department: { select: { id: true, nameFa: true } },\n          replies: true,\n        },\n      });\n      if (existing) return { ok: true, ticket: toView(existing) };\n    }\n    throw err;\n  }\n\n  await audit({\n    userId: input.userId,\n    actor: "user",\n    action: "ticket_created",''')

          # Race-safe Notification creation: P2002 converges to the existing row.
          p=Path('src/lib/notifications/index.ts'); s=p.read_text(encoding='utf-8')
          if 'let notif: Awaited<ReturnType<typeof db.notification.create>>;' not in s:
              replace_once('src/lib/notifications/index.ts',
                  '  const notif = await db.notification.create({',
                  '  let notif: Awaited<ReturnType<typeof db.notification.create>>;\n  try {\n    notif = await db.notification.create({')
              replace_once('src/lib/notifications/index.ts',
                  '  });\n\n  // Look up the user\'s preferences',
                  '''  });\n  } catch (err) {\n    if (input.operationKey && err && typeof err === "object" && "code" in err && err.code === "P2002") {\n      const existing = await db.notification.findUnique({ where: { operationKey: input.operationKey } });\n      if (existing) return { ok: true, notificationId: existing.id, emailSent: false, smsSent: false };\n    }\n    throw err;\n  }\n\n  // Look up the user's preferences''')

          # Never let a stale cursor record overwrite an exact operation-key match.
          replace_once('src/lib/bots/workflow.ts',
              '  if (args.priorHistoryId) {',
              '  if (!prior && args.priorHistoryId) {')

          # Ensure durable inbound-history failures propagate to event processing.
          ed=Path('src/lib/bots/event-dedup.ts'); s=ed.read_text(encoding='utf-8')
          marker='console.error("bot history persist failed:", err instanceof Error ? err.message : err);'
          if marker in s:
              # Replace only the non-fatal comment form, wherever the persist catch currently exists.
              s=s.replace('''    // Never fail the event on observability persistence — but never hide\n    // the failure either.\n    console.error("bot history persist failed:", err instanceof Error ? err.message : err);''',
                          '''    // Persistence is part of the durable event contract. Do not continue without it.\n    console.error("bot history persist failed:", err instanceof Error ? err.message : err);\n    throw err;''')
              ed.write_text(s,encoding='utf-8')

          # Remove automation artifacts created during remediation; retain only canonical CI.
          wfdir=Path('.github/workflows')
          for p in wfdir.iterdir():
              if p.name != 'ci.yml': p.unlink()
          for p in [Path('V7-final2-trigger.txt'), Path('PACKAGE-TRIGGER.txt'), Path('V7-final-trigger.txt')]:
              if p.exists(): p.unlink()

          # Static assertions: exact intended repairs exist before commit.
          assertions = {
            'src/lib/tickets/index.ts': ['operationKey?: string', 'let ticket: Awaited<ReturnType<typeof db.ticket.create>>;', 'err.code === "P2002"'],
            'src/lib/notifications/index.ts': ['operationKey?: string', 'let notif: Awaited<ReturnType<typeof db.notification.create>>;', 'err.code === "P2002"'],
            'src/lib/bots/workflow.ts': ['function workflowOperationKey', 'if (!prior && args.priorHistoryId)', 'شرط گردش کار قابل بررسی نیست'],
            'src/lib/bots/event-dedup.ts': ['attempts: { lt: BOT_EVENT_MAX_ATTEMPTS }'],
            'prisma/schema.prisma': ['workflowVersion String?', 'operationKey  String?  @unique'],
          }
          for f, needles in assertions.items():
              text=Path(f).read_text(encoding='utf-8')
              for n in needles:
                  if n not in text: raise SystemExit(f'assertion failed: {f}: {n!r}')
          print('STATIC REPAIR ASSERTIONS: PASS')
          PY
      - name: Commit source repairs and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'postyar-final-clean'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          git commit -m '[postyar-final-clean] race-safe idempotency and cleanup' || true
          git push origin HEAD:main
